[project]
name = "robot-teleop-ui"
version = "1.0.0"
description = "Real-time web-based teleoperation interface for omnidirectional robots"
authors = [
    {name = "RoboCup Goalkeeper Team"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/Cristian-David-Araujo/robocup-goalkeeper"
Repository = "https://github.com/Cristian-David-Araujo/robocup-goalkeeper"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
